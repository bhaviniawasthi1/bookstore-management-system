services:
  - type: web
    name: leaflore-bookstore
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DDL_AUTO
        value: create
      - key: THYMELEAF_CACHE
        value: "true"
      - key: H2_CONSOLE
        value: "false"

# No database service needed — LeafLore runs on an in-memory H2 database.
# Every time this web service restarts (including Render's free-tier
# sleep/wake cycle), the schema is recreated from scratch and
# DataInitializer reseeds the two shared demo accounts and the starter
# book catalog. Nothing persists between restarts by design — that's what
# makes this safe to leave as a public live demo.

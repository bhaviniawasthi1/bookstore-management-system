<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Cart - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <h2>Shopping Cart</h2>

    <div th:unless="${#lists.isEmpty(items)}">
        <div class="table-responsive">
            <table class="table">
                <thead class="table-light">
                    <tr>
                        <th>Book</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items}">
                        <td>
                            <a th:href="@{/books/{id}(id=${item.bookId})}" th:text="${item.title}">Title</a>
                            <br><small class="text-muted" th:text="${item.author}">Author</small>
                        </td>
                        <td th:text="|$${#numbers.formatDecimal(item.price, 1, 2)}|">$0.00</td>
                        <td>
                            <form th:action="@{/cart/update/{id}(id=${item.id})}" method="post" class="d-flex align-items-center gap-1">
                                <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control" style="width: 70px;">
                                <button type="submit" class="btn btn-sm btn-outline-secondary">Update</button>
                            </form>
                        </td>
                        <td th:text="|$${#numbers.formatDecimal(item.subtotal, 1, 2)}|">$0.00</td>
                        <td>
                            <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="table-active">
                        <td colspan="3" class="text-end"><strong>Total:</strong></td>
                        <td><strong th:text="|$${#numbers.formatDecimal(total, 1, 2)}|">$0.00</strong></td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <form th:action="@{/cart/clear}" method="post">
                <button type="submit" class="btn btn-outline-danger">Clear Cart</button>
            </form>
            <a th:href="@{/checkout}" class="btn btn-primary">Proceed to Checkout</a>
        </div>
    </div>

    <div class="text-center py-5" th:if="${#lists.isEmpty(items)}">
        <i class="bi bi-cart" style="font-size: 4rem;"></i>
        <p class="text-muted mt-2">Your cart is empty.</p>
        <a th:href="@{/books}" class="btn btn-primary">Browse Books</a>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Order #' + order.id + ' - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/orders}">Orders</a></li>
            <li class="breadcrumb-item active">Order #<span th:text="${order.id}">1</span></li>
        </ol>
    </nav>

    <div class="card shadow-sm mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Order #<span th:text="${order.id}">1</span></h4>
            <span class="badge fs-6"
                  th:classappend="${order.status.name() == 'PENDING' ? 'bg-warning' : 
                                  order.status.name() == 'CONFIRMED' ? 'bg-info' :
                                  order.status.name() == 'SHIPPED' ? 'bg-primary' :
                                  order.status.name() == 'DELIVERED' ? 'bg-success' : 'bg-danger'}"
                  th:text="${order.status.name()}">Status</span>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-sm-6">
                    <strong>Order Date:</strong>
                    <span th:text="${#temporals.format(order.orderDate, 'MMM dd, yyyy HH:mm')}">Date</span>
                </div>
                <div class="col-sm-6">
                    <strong>Shipping Address:</strong>
                    <span th:text="${order.shippingAddress}">Address</span>
                </div>
            </div>

            <h5>Items</h5>
            <table class="table">
                <thead class="table-light">
                    <tr>
                        <th>Book</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${order.items}">
                        <td>
                            <a th:href="@{/books/{id}(id=${item.book.id})}" th:text="${item.book.title}">Title</a>
                            <br><small class="text-muted" th:text="${item.book.author}">Author</small>
                        </td>
                        <td th:text="|$${#numbers.formatDecimal(item.price, 1, 2)}|">$0.00</td>
                        <td th:text="${item.quantity}">1</td>
                        <td th:text="|$${#numbers.formatDecimal(item.price * item.quantity, 1, 2)}|">$0.00</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="table-active">
                        <td colspan="3" class="text-end"><strong>Total:</strong></td>
                        <td><strong th:text="|$${#numbers.formatDecimal(order.totalAmount, 1, 2)}|">$0.00</strong></td>
                    </tr>
                </tfoot>
            </table>

            <div th:if="${order.payment != null}" class="mt-3">
                <h5>Payment Details</h5>
                <div class="row">
                    <div class="col-sm-4"><strong>Transaction ID:</strong></div>
                    <div class="col-sm-8" th:text="${order.payment.transactionId}">TXN</div>
                </div>
                <div class="row">
                    <div class="col-sm-4"><strong>Payment Method:</strong></div>
                    <div class="col-sm-8" th:text="${order.payment.paymentMethod.name().replace('_', ' ')}">Method</div>
                </div>
                <div class="row">
                    <div class="col-sm-4"><strong>Payment Status:</strong></div>
                    <div class="col-sm-8">
                        <span class="badge" th:classappend="${order.payment.status.name() == 'SUCCESS' ? 'bg-success' : 'bg-danger'}"
                              th:text="${order.payment.status.name()}">Status</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

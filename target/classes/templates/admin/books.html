<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Manage Books - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Books</h2>
        <a class="btn btn-primary" th:href="@{/admin/books/add}">
            <i class="bi bi-plus-circle"></i> Add New Book
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(books)}">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>ISBN</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}">1</td>
                        <td th:text="${book.title}">Title</td>
                        <td th:text="${book.author}">Author</td>
                        <td><span class="badge bg-secondary" th:text="${book.category}">Category</span></td>
                        <td><small th:text="${book.isbn}">ISBN</small></td>
                        <td th:text="|$${#numbers.formatDecimal(book.price, 1, 2)}|">$0.00</td>
                        <td>
                            <span class="badge" th:classappend="${book.stock > 0 ? 'bg-success' : 'bg-danger'}"
                                  th:text="${book.stock}">0</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/books/edit/{id}(id=${book.id})}">Edit</a>
                            <a class="btn btn-sm btn-outline-danger" th:href="@{/admin/books/delete/{id}(id=${book.id})}"
                               onclick="return confirm('Are you sure you want to delete this book?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="text-center py-5" th:if="${#lists.isEmpty(books)}">
        <p class="text-muted">No books found.</p>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

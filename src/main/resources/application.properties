# Server Configuration
# Render (and most PaaS hosts) inject the port to bind to via the PORT env var.
server.port=${PORT:8080}

# H2 In-Memory Database Configuration
# The entire database lives inside this process's memory. It is created
# fresh every time the app starts and disappears when it stops — perfect
# for a portfolio demo that resets itself whenever Render's free web
# service sleeps and wakes back up. DB_CLOSE_DELAY=-1 just keeps the
# in-memory DB alive for the app's lifetime instead of dropping it the
# instant the first connection closes.
spring.datasource.url=jdbc:h2:mem:bookstore_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Optional web-based DB inspector at /h2-console — handy while developing,
# off by default so a public deploy doesn't expose it. Set H2_CONSOLE=true
# locally if you want to poke around the schema/data in a browser.
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
# Schema is (re)created from the entities on every startup — combined with
# the in-memory DB above and DataInitializer's auto-seeding, this is what
# gives the "fresh start every time it wakes up" behavior.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Checkout - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <h2>Checkout</h2>

    <div class="row">
        <div class="col-md-7">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5>Order Summary</h5>
                    <table class="table">
                        <thead class="table-light">
                            <tr>
                                <th>Book</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${items}">
                                <td th:text="${item.title}">Title</td>
                                <td th:text="${item.quantity}">1</td>
                                <td th:text="|$${#numbers.formatDecimal(item.price, 1, 2)}|">$0.00</td>
                                <td th:text="|$${#numbers.formatDecimal(item.subtotal, 1, 2)}|">$0.00</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="table-active">
                                <td colspan="3" class="text-end"><strong>Total:</strong></td>
                                <td><strong th:text="|$${#numbers.formatDecimal(total, 1, 2)}|">$0.00</strong></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Shipping & Payment</h5>
                    <form th:action="@{/checkout/place}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Shipping Address</label>
                            <textarea name="shippingAddress" class="form-control" rows="3" required
                                      th:text="${user.address}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select name="paymentMethod" class="form-select" required>
                                <option value="" disabled selected>Select payment method</option>
                                <option th:each="method : ${paymentMethods}"
                                        th:value="${method}"
                                        th:text="${method.name().replace('_', ' ')}">
                                </option>
                            </select>
                        </div>

                        <p class="small text-muted">
                            <i class="bi bi-info-circle"></i>
                            This is a simulated payment. No real transaction will be processed.
                        </p>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-check-circle"></i> Place Order
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

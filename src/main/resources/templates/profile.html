<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Profile - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <h2>My Profile</h2>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Profile Information</h5>
                    <form th:action="@{/profile/update}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" class="form-control" th:value="${user.name}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:value="${user.email}" disabled>
                            <small class="text-muted">Email cannot be changed.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" th:value="${user.phone}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="3" th:text="${user.address}"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Account Details</h5>
                    <table class="table">
                        <tr>
                            <td><strong>Role:</strong></td>
                            <td><span class="badge bg-primary" th:text="${user.role.name()}">Role</span></td>
                        </tr>
                        <tr>
                            <td><strong>Member Since:</strong></td>
                            <td th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy')}">Date</td>
                        </tr>
                    </table>
                </div>
            </div>

            <div class="card shadow-sm mt-3">
                <div class="card-body">
                    <h5>Quick Links</h5>
                    <div class="d-grid gap-2">
                        <a class="btn btn-outline-primary" th:href="@{/orders}">View Orders</a>
                        <a class="btn btn-outline-primary" th:href="@{/cart}">View Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

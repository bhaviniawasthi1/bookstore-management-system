<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Error - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-5 fade-in">
    <div class="text-center py-5 empty-state">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
        <h2 class="mt-3">Something went wrong</h2>
        <p class="text-muted" th:text="${error}">Error message</p>
        <a class="btn btn-primary" th:href="@{/}">Return Home</a>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

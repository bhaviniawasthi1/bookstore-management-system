<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(book.title + ' - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4 fade-in">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/books}">Books</a></li>
            <li class="breadcrumb-item active" th:text="${book.title}">Title</li>
        </ol>
    </nav>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="book-cover" style="height: 220px; font-size: 4.5rem; border-radius: .85rem .85rem 0 0;">
                    <i class="bi bi-book"></i>
                </div>
                <div class="card-body text-center">
                    <h4 th:text="${book.title}">Title</h4>
                    <p class="text-muted mb-0" th:text="${book.author}">Author</p>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 th:text="${book.title}">Title</h3>
                    <h5 class="text-muted" th:text="${book.author}">Author</h5>
                    <hr>
                    <div class="row mb-3">
                        <div class="col-sm-4"><strong>Category:</strong></div>
                        <div class="col-sm-8"><span class="badge bg-secondary" th:text="${book.category}">Category</span></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4"><strong>ISBN:</strong></div>
                        <div class="col-sm-8" th:text="${book.isbn}">ISBN</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4"><strong>Price:</strong></div>
                        <div class="col-sm-8"><span class="h4 book-price" th:text="|$${#numbers.formatDecimal(book.price, 1, 2)}|">$0.00</span></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4"><strong>Stock:</strong></div>
                        <div class="col-sm-8">
                            <span class="badge bg-success" th:if="${book.stock > 10}" th:text="|${book.stock} in stock|"></span>
                            <span class="badge bg-warning" th:if="${book.stock > 0 and book.stock <= 10}" th:text="|Only ${book.stock} left|"></span>
                            <span class="badge bg-danger" th:unless="${book.stock > 0}">Out of stock</span>
                        </div>
                    </div>
                    <div class="row mb-3" th:if="${book.description != null}">
                        <div class="col-sm-4"><strong>Description:</strong></div>
                        <div class="col-sm-8" th:text="${book.description}">Description</div>
                    </div>
                    <hr>
                    <div sec:authorize="isAuthenticated()" th:if="${book.stock > 0}">
                        <form th:action="@{/cart/add/{id}(id=${book.id})}" method="post" class="d-flex align-items-center gap-2">
                            <label class="form-label mb-0">Quantity:</label>
                            <input type="number" name="quantity" value="1" min="1" th:max="${book.stock}" class="form-control" style="width: 90px;">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-cart-plus"></i> Add to Cart
                            </button>
                        </form>
                    </div>
                    <div sec:authorize="!isAuthenticated()">
                        <a th:href="@{/login}" class="btn btn-primary">Login to Purchase</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

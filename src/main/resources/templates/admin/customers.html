<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Customers - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4 fade-in">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <h2 class="mb-4">Customers</h2>

    <div class="table-responsive mt-3">
        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Registered</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.id}">1</td>
                    <td th:text="${customer.name}">Name</td>
                    <td th:text="${customer.email}">Email</td>
                    <td th:text="${customer.phone ?: 'N/A'}">Phone</td>
                    <td th:text="${customer.address ?: 'N/A'}">Address</td>
                    <td th:text="${#temporals.format(customer.createdAt, 'MMM dd, yyyy')}">Date</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center py-5" th:if="${#lists.isEmpty(customers)}">
        <p class="text-muted">No customers registered yet.</p>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

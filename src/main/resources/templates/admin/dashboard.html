<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Admin Dashboard - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <h2>Admin Dashboard</h2>

    <div class="row mt-4">
        <div class="col-md-4 mb-4">
            <div class="card bg-primary text-white shadow">
                <div class="card-body text-center py-4">
                    <i class="bi bi-book" style="font-size: 2.5rem;"></i>
                    <h3 class="mt-2" th:text="${totalBooks}">0</h3>
                    <p class="mb-0">Total Books</p>
                </div>
                <div class="card-footer bg-primary border-0 text-center">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/admin/books}">Manage Books</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card bg-success text-white shadow">
                <div class="card-body text-center py-4">
                    <i class="bi bi-box-seam" style="font-size: 2.5rem;"></i>
                    <h3 class="mt-2" th:text="${totalOrders}">0</h3>
                    <p class="mb-0">Total Orders</p>
                </div>
                <div class="card-footer bg-success border-0 text-center">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/admin/orders}">View Orders</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card bg-info text-white shadow">
                <div class="card-body text-center py-4">
                    <i class="bi bi-people" style="font-size: 2.5rem;"></i>
                    <h3 class="mt-2" th:text="${totalCustomers}">0</h3>
                    <p class="mb-0">Total Customers</p>
                </div>
                <div class="card-footer bg-info border-0 text-center">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/admin/customers}">View Customers</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-2">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Quick Actions</h5>
                    <div class="d-flex gap-2 flex-wrap">
                        <a class="btn btn-primary" th:href="@{/admin/books/add}">
                            <i class="bi bi-plus-circle"></i> Add New Book
                        </a>
                        <a class="btn btn-outline-primary" th:href="@{/admin/books}">
                            <i class="bi bi-book"></i> Manage Books
                        </a>
                        <a class="btn btn-outline-success" th:href="@{/admin/orders}">
                            <i class="bi bi-box"></i> Manage Orders
                        </a>
                        <a class="btn btn-outline-info" th:href="@{/admin/customers}">
                            <i class="bi bi-people"></i> View Customers
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Books - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Books</h2>
        <form class="d-flex" th:action="@{/books}" method="get">
            <input class="form-control me-2" type="search" name="keyword" placeholder="Search by title or author" th:value="${keyword}">
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
    </div>

    <div class="row" th:unless="${#lists.isEmpty(books)}">
        <div class="col-md-3 mb-4" th:each="book : ${books}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${book.title}">Title</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${book.author}">Author</h6>
                    <span class="badge bg-secondary mb-2 align-self-start" th:text="${book.category}">Category</span>
                    <p class="card-text small flex-grow-1" th:text="${#strings.abbreviate(book.description, 100)}">Description</p>
                    <div class="d-flex justify-content-between align-items-center mt-auto">
                        <span class="h5 mb-0 text-primary" th:text="|$${#numbers.formatDecimal(book.price, 1, 2)}|">$0.00</span>
                        <div>
                            <span class="badge bg-info me-1" th:if="${book.stock > 0}" th:text="|${book.stock} in stock|"></span>
                            <span class="badge bg-danger" th:unless="${book.stock > 0}">Out of stock</span>
                        </div>
                    </div>
                    <div class="mt-2">
                        <a class="btn btn-sm btn-outline-primary w-100" th:href="@{/books/{id}(id=${book.id})}">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-5" th:if="${#lists.isEmpty(books)}">
        <i class="bi bi-search" style="font-size: 3rem;"></i>
        <p class="text-muted mt-2" th:if="${keyword != null}">No books found matching "<span th:text="${keyword}"></span>"</p>
        <p class="text-muted mt-2" th:unless="${keyword != null}">No books available yet.</p>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>

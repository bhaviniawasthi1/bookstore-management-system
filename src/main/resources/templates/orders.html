<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('My Orders - LeafLore')}"></head>
<body>

<div th:replace="~{fragments/common :: navbar}"></div>

<div class="container mt-4">
    <div th:replace="~{fragments/common :: alerts}"></div>

    <h2>My Orders</h2>

    <div th:unless="${#lists.isEmpty(orders)}">
        <div class="table-responsive">
            <table class="table">
                <thead class="table-light">
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td>#<span th:text="${order.id}">1</span></td>
                        <td th:text="${#temporals.format(order.orderDate, 'MMM dd, yyyy HH:mm')}">Date</td>
                        <td th:text="${order.items.size()}">0</td>
                        <td th:text="|$${#numbers.formatDecimal(order.totalAmount, 1, 2)}|">$0.00</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${order.status.name() == 'PENDING' ? 'bg-warning' : 
                                                  order.status.name() == 'CONFIRMED' ? 'bg-info' :
                                                  order.status.name() == 'SHIPPED' ? 'bg-primary' :
                                                  order.status.name() == 'DELIVERED' ? 'bg-success' : 'bg-danger'}"
                                  th:text="${order.status.name()}">Status</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/orders/{id}(id=${order.id})}">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="text-center py-5" th:if="${#lists.isEmpty(orders)}">
        <i class="bi bi-box" style="font-size: 4rem;"></i>
        <p class="text-muted mt-2">You haven't placed any orders yet.</p>
        <a th:href="@{/books}" class="btn btn-primary">Start Shopping</a>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>
